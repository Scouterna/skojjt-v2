services:
  postgres:
    image: postgres:18-alpine
    container_name: skojjt-postgres
    environment:
      POSTGRES_DB: skojjt
      POSTGRES_USER: skojjt
      POSTGRES_PASSWORD: dev_password_123
    ports:
      - "5433:5432"  # Use port 5433 to avoid conflict with native PostgreSQL
    volumes:
      # Postgres 18+ stores data in major-version subdirectories, so the mount
      # goes at /var/lib/postgresql rather than .../data. Mounting the old path
      # makes the image refuse to start.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skojjt -d skojjt"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4
    container_name: skojjt-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
